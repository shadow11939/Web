<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Ký - Web bán đồ dùng học tập</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="images/logo.webp" alt="Logo" class="logo">
            <h1>Đăng Ký Tài Khoản</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="products.html">Sản Phẩm</a></li>
                <li><a href="#contact">Liên Hệ</a></li>
                <li><a href="cart.html">Giỏ Hàng</a></li>
                <li><a href="signin.html">Đăng Nhập</a></li>
                <li><a href="signup.html">Đăng Ký</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="auth-section">
            <div class="auth-container">
                <h2>Tạo Tài Khoản Mới</h2>
                <form id="signup-form" class="auth-form">
                    <div class="form-group">
                        <label for="fullname">Họ và Tên:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mật Khẩu:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Xác Nhận Mật Khẩu:</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                    <button type="submit" class="btn auth-btn">Đăng Ký</button>
                </form>
                <p class="auth-link">Đã có tài khoản? <a href="signin.html">Đăng nhập ngay</a></p>
            </div>
        </section>
    </main>
    <script src="auth.js"></script>
    <script src="signup.js"></script>
</body>
</html>
